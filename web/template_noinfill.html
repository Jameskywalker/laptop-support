<title>无填充支撑</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 布局：标题 → 左侧大视窗（下接控制条）+ 右侧数据栏；窄屏时数据栏落到视窗下方 */
:root {
  --bg: #ECEFF2; --panel: #FFFFFF; --fg: #17202A; --muted: #5A6773; --line: #D2D9E0;
  --accent: #2958CC; --accent-fg: #FFFFFF; --view: #E2E7EC; --bed: #C7D0D8; --grid: #AEB9C4;
  --flat: #6E8AA8; --ref: #8A96A3;
  --v0: #440154; --v1: #3B528B; --v2: #21918C; --v3: #5EC962; --v4: #FDE725;
  --sans: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Hiragino Sans GB", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1318; --panel: #151C23; --fg: #E2E8EE; --muted: #8C99A6; --line: #27313B;
  --accent: #7FA4FF; --accent-fg: #0E1318; --view: #111820; --bed: #26313C; --grid: #3A4652;
  --flat: #7F9BBA; --ref: #6F7C89; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0E1318; --panel: #151C23; --fg: #E2E8EE; --muted: #8C99A6; --line: #27313B;
  --accent: #7FA4FF; --accent-fg: #0E1318; --view: #111820; --bed: #26313C; --grid: #3A4652;
  --flat: #7F9BBA; --ref: #6F7C89; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); line-height: 1.55 }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 22px 36px; display: grid; gap: 18px }
header { display: grid; gap: 6px; max-width: 72ch }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .06em; color: var(--muted) }
h1 { font-size: clamp(22px, 3vw, 30px); line-height: 1.2; margin: 0; font-weight: 650; text-wrap: balance }
header p { margin: 0; color: var(--muted); font-size: 15px }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 18px; align-items: start }
@media (max-width: 960px) { .main { grid-template-columns: minmax(0, 1fr) } }
.stage { display: grid; gap: 10px; min-width: 0 }
.viewer { position: relative; background: var(--view); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; height: clamp(340px, 64vh, 700px) }
.viewer canvas { display: block; width: 100%; height: 100% }
.hint { position: absolute; right: 12px; top: 10px; font-size: 12px; color: var(--muted); pointer-events: none }
.legend { position: absolute; left: 12px; bottom: 12px; display: grid; gap: 4px; font-family: var(--mono); font-size: 11px; color: var(--muted); background: color-mix(in srgb, var(--view) 82%, transparent); padding: 6px 8px; border-radius: 6px }
.legend .bar { width: 180px; height: 9px; border-radius: 2px; background: linear-gradient(90deg, var(--v0), var(--v1), var(--v2), var(--v3), var(--v4)) }
.legend .ticks { display: flex; justify-content: space-between; width: 180px }
.controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel) }
.seg button { font: inherit; font-size: 13px; border: 0; background: transparent; color: var(--fg); padding: 6px 12px; cursor: pointer }
.seg button + button { border-left: 1px solid var(--line) }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg) }
.seg button:focus-visible, .play:focus-visible, input[type=range]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.lbl { font-size: 12px; color: var(--muted); margin-right: 6px }
.layer { display: flex; align-items: center; gap: 10px; flex: 1 1 320px; min-width: 0 }
.layer input { flex: 1; min-width: 0; accent-color: var(--accent) }
.layer output { font-family: var(--mono); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; min-width: 15ch }
.play { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 8px; padding: 5px 10px; cursor: pointer }
.layer.off { opacity: .45; pointer-events: none }
aside { display: grid; gap: 14px; min-width: 0 }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px; min-width: 0 }
h2 { font-size: 13px; margin: 0; font-weight: 650; letter-spacing: .02em }
.sub { font-size: 12px; color: var(--muted); margin: -6px 0 0 }
dl.facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: 13px }
dl.facts dt { color: var(--muted) }
dl.facts dd { margin: 0; font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right }
table { width: 100%; border-collapse: collapse; font-size: 13px }
th { font-weight: 500; color: var(--muted); text-align: left; font-size: 12px; padding-bottom: 4px }
td { padding: 3px 0; vertical-align: middle }
td.num, th.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; padding-left: 8px; white-space: nowrap }
td.barc { width: 42%; padding-left: 10px }
.bar { position: relative; height: 8px; background: color-mix(in srgb, var(--line) 60%, transparent); border-radius: 2px }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 2px }
.bar b { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--fg); opacity: .55 }
svg text { font-family: var(--mono); font-size: 10px; fill: var(--muted) }
.notes { margin: 0; padding-left: 1.1em; font-size: 13px; color: var(--muted); display: grid; gap: 4px }
.key { display: flex; gap: 14px; font-size: 12px; color: var(--muted) }
.key span::before { content: ""; display: inline-block; width: 14px; height: 2px; vertical-align: middle; margin-right: 5px; background: var(--accent) }
.key span.ref::before { background: var(--ref) }
.err { color: var(--muted); padding: 20px }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }

.cmp td.num b { font-weight: 600 }
.sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: baseline }
.sw.free { background: var(--accent) } .sw.gable { background: var(--v2) } .sw.flat { background: var(--ref) }
.bar i.gable { background: var(--v2) }
.bar.two { height: 12px } .bar.two i { height: 5px; bottom: auto } .bar.two i.gable { top: 6px }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">DESK40 · 40° 前挡落桌 · 单侧支撑 · 不用稀疏填充</div>
    <h1>无填充支撑</h1>
    <p id="lead">直接在三维体素上做拓扑优化，不从二维结果出发。打印时侧面贴床，内部不用稀疏填充：模型里有材料的地方都是实心，空腔和封顶的拱由优化给出。每个体素都要落在下一层的十字邻域上，所以斜面不超过 45°，空腔顶部收成尖拱。</p>
  </header>
  <div class="main">
    <div class="stage">
      <div class="viewer" id="viewer">
        <div class="hint" id="hint">拖动旋转 · 滚轮缩放 · 右键平移</div>
        <div class="legend" id="legend"><span>离床面高度（mm）</span><div class="bar"></div><div class="ticks"><span>0</span><span>5</span><span>10</span><span>15</span></div></div>
      </div>
      <div class="controls">
        <div><span class="lbl">视图</span><span class="seg" id="seg-view"><button id="v-print" data-v="print" aria-pressed="true">打印姿态</button><button id="v-asm" data-v="asm" aria-pressed="false">装配</button></span></div>
        <div><span class="lbl">模型</span><span class="seg" id="seg-model"></span></div>
        <div id="padsbox" hidden><span class="lbl">TPU 垫</span><span class="seg" id="seg-pads"><button data-p="on" aria-pressed="true">显示</button><button data-p="off" aria-pressed="false">隐藏</button></span></div>
        <div><span class="lbl">剖切</span><span class="seg" id="seg-cut"><button id="c-z" data-c="z" aria-pressed="true">逐层</button><button id="c-x" data-c="x" aria-pressed="false">横切</button></span></div>
        <div class="layer" id="layerbox">
          <button class="play" id="play" type="button">播放</button>
          <input type="range" id="layer" min="0" max="1000" value="1000" aria-label="剖切位置">
          <output id="layerout" for="layer"></output>
        </div>
      </div>
    </div>
    <aside>
      <section>
        <h2>概况</h2>
        <dl class="facts" id="facts"></dl>
      </section>
      <section>
        <h2>各工况刚度</h2>
        <p class="sub">同样用料，柔度相对二维方案（= 1，竖线），越小越硬</p>
        <table id="comp" class="cmp"></table>
      </section>
      <section>
        <h2>150 N 误用</h2>
        <p class="sub">手肘撑在前部 / 转轴处。屈曲系数 = 屈曲载荷 ÷ 150 N</p>
        <table id="mis"></table>
      </section>
      <section>
        <h2>说明</h2>
        <ul class="notes" id="notes"></ul>
      </section>
    </aside>
  </div>
</div>

<script type="application/json" id="data">/*__DATA__*/</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  const D = JSON.parse(document.getElementById('data').textContent);
  const $ = (id) => document.getElementById(id);
  const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const fmt = (v, d) => Number(v).toFixed(d);
  const des = D.designs, byKey = Object.fromEntries(des.map(d => [d.key, d]));
  const ck = D.cmpKey || 'gable', sh = D.short || { free: '三维', gable: '尖拱', flat: '二维' };
  const free = byKey.free, gable = byKey[ck], flat = byKey.flat;

  // ---------- 面板 ----------
  const pct = (r) => (r < 1 ? '低 ' + Math.round((1 - r) * 100) + '%' : '高 ' + Math.round((r - 1) * 100) + '%');
  if (D.leadExtra) $('lead').textContent += D.leadExtra;
  $('lead').textContent += '同样用料下，加权柔度比二维方案' + pct(free.weighted) + '（越低越硬）。';
  const facts = [
    ['单片用料（PETG）', fmt(free.mass, 0) + ' g（二维 ' + fmt(flat.mass, 0) + '）'],
    ['加权柔度（二维 = 1）', fmt(free.weighted, 2) + '（' + sh[ck] + ' ' + fmt(gable.weighted, 2) + '）'],
    ['封闭空腔', D.cavities.length + ' 个，共 ' + fmt(D.cavities.reduce((a, b) => a + b, 0), 0) + ' mm³'],
    ['悬空（> 45°，宽 > 2 mm）', fmt(D.overhang.area, 1) + ' mm²'],
    ['收顶短桥（宽 ≤ 2 mm）', fmt(D.overhang.bridge, 1) + ' mm²'],
    ['薄壁', D.thinFact || ('最薄 ' + fmt(D.h, 2) + ' mm（3 层），占有料面积 ' + Math.round(D.thin * 100) + '%')],
    ['网格', '优化用 ' + fmt(D.h, 3) + ' mm 立方体素（厚度方向 ' + D.nz + ' 格）' + (D.layer ? '；STL 平滑后按 ' + fmt(D.layer, 1) + ' mm 打印层重建' : '')],
    ...(D.padsInfo ? [['TPU 垫', D.padsInfo]] : []),
  ];
  $('facts').innerHTML = facts.map(([k, v]) => '<dt>' + k + '</dt><dd>' + v + '</dd>').join('');
  const xmax = Math.max(1.25, ...D.cases.map(c => Math.max(free.rel[c], gable.rel[c])));
  $('comp').innerHTML = '<tr><th>工况</th><th class="num"><span class="sw free"></span>' + sh.free + '</th><th class="num"><span class="sw gable"></span>' + sh[ck] + '</th><th></th></tr>' + D.cases.map(c =>
    '<tr><td>' + c + '</td><td class="num"><b>' + fmt(free.rel[c], 2) + '</b></td><td class="num">' + fmt(gable.rel[c], 2) + '</td><td class="barc"><div class="bar two"><i style="width:' +
    (free.rel[c] / xmax * 100).toFixed(1) + '%"></i><i class="gable" style="width:' + (gable.rel[c] / xmax * 100).toFixed(1) + '%"></i><b style="left:' + (100 / xmax).toFixed(1) + '%"></b></div></td></tr>').join('') +
    '<tr><td><b>加权</b></td><td class="num"><b>' + fmt(free.weighted, 2) + '</b></td><td class="num">' + fmt(gable.weighted, 2) + '</td><td></td></tr>';
  const rows = [['屈曲系数 · 前部', 'buck_f', 1], ['屈曲系数 · 后部', 'buck_r', 1], ['应力 99.9% · 前部 MPa', 'vm_f', 1], ['应力 99.9% · 后部 MPa', 'vm_r', 1],
                ['侧向位移 · 后部 µm', 'z_r', 0]];
  $('mis').innerHTML = '<tr><th></th><th class="num"><span class="sw flat"></span>' + sh.flat + '</th><th class="num"><span class="sw gable"></span>' + sh[ck] + '</th><th class="num"><span class="sw free"></span>' + sh.free + '</th></tr>' +
    rows.map(([k, f, d]) => '<tr><td>' + k + '</td>' + [flat, gable, free].map(x => '<td class="num">' + fmt(x[f], d) + '</td>').join('') + '</tr>').join('');
  $('notes').innerHTML = D.notes.map(t => '<li>' + t + '</li>').join('');

  // 模型按钮
  $('seg-model').innerHTML = D.models.map((m, i) => '<button data-m="' + m.key + '" aria-pressed="' + (i === 0) + '">' + m.label + '</button>').join('');

  if (!window.THREE || !THREE.OrbitControls) { $('viewer').innerHTML = '<p class="err">三维视图加载失败（three.js 没有加载上）。右侧数据不受影响。</p>'; return; }

  // ---------- 网格 ----------
  const u8 = (s) => { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
  const stops = ['--v0', '--v1', '--v2', '--v3', '--v4'].map(n => new THREE.Color(css(n)));
  function ramp(t) { t = Math.min(1, Math.max(0, t)) * 4; const i = Math.min(3, Math.floor(t)); return stops[i].clone().lerp(stops[i + 1], t - i); }
  function geom(pk) {
    const q = new Uint16Array(u8(pk.pos).buffer), n = q.length / 3, pos = new Float32Array(q.length), col = new Float32Array(q.length);
    for (let i = 0; i < n; i++) {
      for (let d = 0; d < 3; d++) pos[3 * i + d] = pk.min[d] + q[3 * i + d] / 65535 * pk.size[d];
      const c = ramp(pos[3 * i + 2] / D.T); col[3 * i] = c.r; col[3 * i + 1] = c.g; col[3 * i + 2] = c.b;
    }
    const idx = pk.u32 ? new Uint32Array(u8(pk.idx).buffer) : new Uint16Array(u8(pk.idx).buffer);
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    g.setIndex(new THREE.BufferAttribute(idx, 1));
    return g;
  }
  const G = {}; D.models.forEach(m => G[m.key] = geom(m.mesh));
  const Gb = geom(D.beam), Gp = geom(D.panel);

  const viewer = $('viewer');
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.localClippingEnabled = true;
  viewer.prepend(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, 1, 1, 5000);
  camera.up.set(0, 0, 1);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 0.75));
  const sun = new THREE.DirectionalLight(0xffffff, 0.75); sun.position.set(-0.5, -0.8, 1.2); scene.add(sun);
  const fill = new THREE.DirectionalLight(0xffffff, 0.25); fill.position.set(0.8, 0.6, -0.4); scene.add(fill);

  const clip = new THREE.Plane(new THREE.Vector3(0, 0, -1), D.T);
  const NL = D.layer ? Math.round(D.T / D.layer) : D.nz;     // 逐层剖切：按打印层（STL 按打印层重建时），否则按体素层
  const matSup = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, side: THREE.DoubleSide, roughness: 0.65, metalness: 0 });
  const matLink = new THREE.MeshStandardMaterial({ flatShading: true, roughness: 0.7, metalness: 0, color: 0xb9c2cc });
  const matPad = new THREE.MeshStandardMaterial({ flatShading: true, side: THREE.DoubleSide, roughness: 0.95, metalness: 0, color: 0x2f3338 });   // TPU 垫：深灰
  const M4 = (a) => new THREE.Matrix4().set(...a);

  // 打印姿态：H3C 热床 330 × 320 mm
  const print = new THREE.Group(); scene.add(print);
  const bedMat = new THREE.MeshBasicMaterial({ side: THREE.DoubleSide });
  const bed = new THREE.Mesh(new THREE.PlaneGeometry(D.bed[0], D.bed[1]), bedMat); bed.position.z = -0.05; print.add(bed);
  const gl = [];
  for (let x = -D.bed[0] / 2; x <= D.bed[0] / 2 + 1e-6; x += 10) gl.push(x, -D.bed[1] / 2, 0, x, D.bed[1] / 2, 0);
  for (let y = -D.bed[1] / 2; y <= D.bed[1] / 2 + 1e-6; y += 10) gl.push(-D.bed[0] / 2, y, 0, D.bed[0] / 2, y, 0);
  const gridGeo = new THREE.BufferGeometry(); gridGeo.setAttribute('position', new THREE.Float32BufferAttribute(gl, 3));
  const gridMat = new THREE.LineBasicMaterial({ transparent: true, opacity: 0.6 });
  print.add(new THREE.LineSegments(gridGeo, gridMat));
  const pm = {};
  for (const m of D.models) { pm[m.key] = new THREE.Mesh(G[m.key], matSup); pm[m.key].position.set(-D.center[0], -D.center[1], 0); print.add(pm[m.key]); }
  // TPU 垫（可选，pads.py）：网格是支撑坐标，打印姿态里卡在支撑上显示，装配里两片支撑都装上
  const padObjs = [];
  if (D.pads) {
    const Gpad = geom(D.pads);
    const o = new THREE.Mesh(Gpad, matPad); o.position.set(-D.center[0], -D.center[1], 0); print.add(o); padObjs.push(o);
    for (const mat of D.supportMats) { const a = new THREE.Mesh(Gpad, matPad); a.matrixAutoUpdate = false; a.matrix.copy(M4(mat)); padObjs.push(a); }
  }

  // 装配：两片支撑（右侧为镜像）+ 面板 + 后横梁
  const asm = new THREE.Group(); scene.add(asm);
  const am = {};
  for (const m of D.models) { am[m.key] = []; for (const mat of D.supportMats) {
    const o = new THREE.Mesh(G[m.key], matSup); o.matrixAutoUpdate = false; o.matrix.copy(M4(mat)); asm.add(o); am[m.key].push(o); } }
  for (const [g, mat] of [[Gb, D.beamMat], [Gp, D.panelMat]]) { const o = new THREE.Mesh(g, matLink); o.matrixAutoUpdate = false; o.matrix.copy(M4(mat)); asm.add(o); }
  padObjs.slice(1).forEach(o => asm.add(o));

  const S = { view: 'print', model: D.models[0].key, cut: 'z', pos: 1, pads: 'on' };
  function render() { renderer.render(scene, camera); }
  function frame(obj) {
    const box = new THREE.Box3().setFromObject(obj), c = box.getCenter(new THREE.Vector3()), r = box.getSize(new THREE.Vector3()).length() / 2;
    const dir = S.view === 'print' ? new THREE.Vector3(-0.35, -1.0, 0.95) : new THREE.Vector3(-1.1, -0.9, 0.75);
    const dist = r / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * (S.view === 'print' ? 0.85 : 0.95);
    controls.target.copy(c); camera.position.copy(c).add(dir.normalize().multiplyScalar(dist)); controls.update();
  }
  function apply(refit) {
    print.visible = S.view === 'print'; asm.visible = S.view === 'asm';
    for (const k in pm) pm[k].visible = k === S.model;
    for (const k in am) am[k].forEach(o => o.visible = k === S.model);
    matSup.clippingPlanes = S.view === 'print' ? [clip] : [];
    matSup.needsUpdate = true;
    matPad.clippingPlanes = matSup.clippingPlanes; matPad.needsUpdate = true;
    padObjs.forEach(o => o.visible = S.pads === 'on');
    $('layerbox').classList.toggle('off', S.view !== 'print');
    $('seg-cut').parentElement.classList.toggle('off', S.view !== 'print');
    if (S.cut === 'z') {
      const k = Math.max(1, Math.round(S.pos * NL)), zc = k * D.T / NL;
      clip.normal.set(0, 0, -1); clip.constant = zc + 1e-3;
      $('layerout').textContent = '第 ' + k + ' / ' + NL + ' 层 · z ' + fmt(zc, 1) + ' mm';
    } else {
      const xc = 2 + S.pos * (D.xmax - 2);
      clip.normal.set(-1, 0, 0); clip.constant = xc - D.center[0];
      $('layerout').textContent = '保留 x < ' + fmt(xc, 0) + ' mm';
    }
    if (refit) frame(S.view === 'print' ? pm[S.model] : asm);
    render();
  }
  function seg(id, key) {
    $(id).addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      S[key] = b.dataset.v || b.dataset.m || b.dataset.c || b.dataset.p;
      $(id).querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      if (key === 'cut') { S.pos = 1; slider.value = 1000; }
      apply(key === 'view');
    });
  }
  const slider = $('layer');
  seg('seg-view', 'view'); seg('seg-model', 'model'); seg('seg-cut', 'cut'); seg('seg-pads', 'pads');
  $('padsbox').hidden = !D.pads;
  slider.addEventListener('input', () => { S.pos = +slider.value / 1000; apply(false); });
  let timer = null;
  $('play').addEventListener('click', () => {
    if (timer) { clearInterval(timer); timer = null; $('play').textContent = '播放'; return; }

      if (S.pos >= 1) { clearInterval(timer); timer = null; $('play').textContent = '播放'; }
    }, reduce ? 250 : 70);
  });
  controls.addEventListener('change', render);
  function theme() { renderer.setClearColor(css('--view')); bedMat.color.set(css('--bed')); gridMat.color.set(css('--grid')); render(); }
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', theme);
  new MutationObserver(theme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  new ResizeObserver(() => { const w = viewer.clientWidth, h = viewer.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); render(); }).observe(viewer);
  theme(); apply(true);
})();
</script>
